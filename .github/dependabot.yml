version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(Deps): '

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(Deps): '
    cooldown:
      default-days: 5
      include:
        - '*'
    groups:
      all:
        applies-to: version-updates
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: 'ci(Deps): '
    cooldown:
      default-days: 3
      include:
        - '*'
    groups:
      all:
        applies-to: version-updates
        patterns:
          - '*'

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(DevContainer): '
